<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="250" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" text-anchor="middle" fill="#2c3e50">Trend Analysis Workflow</text>
  
  <!-- Components -->
  <!-- Reviews -->
  <rect x="50" y="80" width="120" height="60" rx="5" ry="5" fill="#3498db" opacity="0.8"/>
  <text x="110" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Customer Reviews</text>
  
  <!-- Topic Extraction -->
  <rect x="220" y="80" width="120" height="60" rx="5" ry="5" fill="#2c3e50" opacity="0.9"/>
  <text x="280" y="105" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Topic</text>
  <text x="280" y="125" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Extraction</text>
  
  <!-- Sentiment Analysis -->
  <rect x="390" y="80" width="120" height="60" rx="5" ry="5" fill="#e74c3c" opacity="0.8"/>
  <text x="450" y="105" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Sentiment</text>
  <text x="450" y="125" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Analysis</text>
  
  <!-- Temporal Analysis -->
  <rect x="560" y="80" width="120" height="60" rx="5" ry="5" fill="#f39c12" opacity="0.8"/>
  <text x="620" y="105" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Temporal</text>
  <text x="620" y="125" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Analysis</text>
  
  <!-- Trend Report -->
  <rect x="390" y="180" width="120" height="60" rx="5" ry="5" fill="#2ecc71" opacity="0.8"/>
  <text x="450" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Trend Report</text>
  <text x="450" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="white">(Insights)</text>
  
  <!-- Connector Lines -->
  <!-- Reviews to Topic Extraction -->
  <line x1="170" y1="110" x2="220" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="220,110 210,105 210,115" fill="#666"/>
  
  <!-- Topic Extraction to Sentiment Analysis -->
  <line x1="340" y1="110" x2="390" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="390,110 380,105 380,115" fill="#666"/>
  
  <!-- Sentiment Analysis to Temporal Analysis -->
  <line x1="510" y1="110" x2="560" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="560,110 550,105 550,115" fill="#666"/>
  
  <!-- Topic Extraction to Trend Report -->
  <line x1="280" y1="140" x2="390" y2="180" stroke="#666" stroke-width="2"/>
  <polygon points="390,180 380,175 385,170" fill="#666"/>
  
  <!-- Sentiment Analysis to Trend Report -->
  <line x1="450" y1="140" x2="450" y2="180" stroke="#666" stroke-width="2"/>
  <polygon points="450,180 445,170 455,170" fill="#666"/>
  
  <!-- Temporal Analysis to Trend Report -->
  <line x1="620" y1="140" x2="510" y2="180" stroke="#666" stroke-width="2"/>
  <polygon points="510,180 520,175 515,170" fill="#666"/>
  
  <!-- Data Flow Labels -->
  <text x="195" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Raw Text</text>
  <text x="365" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Topics</text>
  <text x="535" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Sentiment</text>
  
  <!-- Topic Details -->
  <rect x="220" y="150" width="120" height="40" rx="5" ry="5" fill="#ecf0f1" stroke="#2c3e50"/>
  <text x="280" y="175" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">• Keywords</text>
  <text x="280" y="190" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">• Frequency</text>
  
  <!-- Sentiment Details -->
  <rect x="390" y="150" width="120" height="20" rx="5" ry="5" fill="#ecf0f1" stroke="#2c3e50"/>
  <text x="450" y="165" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">• Polarity & Score</text>
  
  <!-- Temporal Details -->
  <rect x="560" y="150" width="120" height="40" rx="5" ry="5" fill="#ecf0f1" stroke="#2c3e50"/>
  <text x="620" y="165" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">• Changes Over Time</text>
  <text x="620" y="180" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">• Emerging Trends</text>
</svg>
