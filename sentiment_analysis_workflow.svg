<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="250" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" text-anchor="middle" fill="#2c3e50">Sentiment Analysis Workflow</text>
  
  <!-- Components -->
  <!-- Input Text -->
  <rect x="50" y="80" width="120" height="60" rx="5" ry="5" fill="#3498db" opacity="0.8"/>
  <text x="110" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Review Text</text>
  
  <!-- Preprocessing -->
  <rect x="220" y="80" width="120" height="60" rx="5" ry="5" fill="#2c3e50" opacity="0.9"/>
  <text x="280" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Preprocessing</text>
  
  <!-- Decision Diamond -->
  <polygon points="400,110 430,80 460,110 430,140" fill="#e74c3c" opacity="0.8"/>
  <text x="430" y="115" font-family="Arial" font-size="12" text-anchor="middle" fill="white">LLM?</text>
  
  <!-- LLM Analysis -->
  <rect x="510" y="50" width="120" height="60" rx="5" ry="5" fill="#9b59b6" opacity="0.8"/>
  <text x="570" y="85" font-family="Arial" font-size="14" text-anchor="middle" fill="white">LLM Analysis</text>
  
  <!-- Rule-based Analysis -->
  <rect x="510" y="150" width="120" height="60" rx="5" ry="5" fill="#f39c12" opacity="0.8"/>
  <text x="570" y="185" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Rule-based</text>
  
  <!-- Results -->
  <rect x="680" y="80" width="120" height="60" rx="5" ry="5" fill="#2ecc71" opacity="0.8"/>
  <text x="740" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Sentiment</text>
  <text x="740" y="135" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Results</text>
  
  <!-- Connector Lines -->
  <!-- Text to Preprocessing -->
  <line x1="170" y1="110" x2="220" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="220,110 210,105 210,115" fill="#666"/>
  
  <!-- Preprocessing to Decision -->
  <line x1="340" y1="110" x2="400" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="400,110 390,105 390,115" fill="#666"/>
  
  <!-- Decision to LLM -->
  <line x1="460" y1="80" x2="510" y2="80" stroke="#666" stroke-width="2"/>
  <polygon points="510,80 500,75 500,85" fill="#666"/>
  <text x="485" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Yes</text>
  
  <!-- Decision to Rule-based -->
  <line x1="460" y1="140" x2="510" y2="180" stroke="#666" stroke-width="2"/>
  <polygon points="510,180 500,175 505,170" fill="#666"/>
  <text x="485" y="170" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">No</text>
  
  <!-- LLM to Results -->
  <line x1="630" y1="80" x2="680" y2="100" stroke="#666" stroke-width="2"/>
  <polygon points="680,100 670,95 675,105" fill="#666"/>
  
  <!-- Rule-based to Results -->
  <line x1="630" y1="180" x2="680" y2="120" stroke="#666" stroke-width="2"/>
  <polygon points="680,120 670,125 675,115" fill="#666"/>
  
  <!-- Result Details -->
  <rect x="680" y="150" width="120" height="80" rx="5" ry="5" fill="#ecf0f1" stroke="#2c3e50"/>
  <text x="740" y="170" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">• Polarity</text>
  <text x="740" y="190" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">• Score</text>
  <text x="740" y="210" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">• Aspect Analysis</text>
</svg>
