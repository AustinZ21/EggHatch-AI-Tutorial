<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="250" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" text-anchor="middle" fill="#2c3e50">Data Pipeline Workflow</text>
  
  <!-- Data Sources -->
  <rect x="50" y="80" width="100" height="50" rx="5" ry="5" fill="#3498db" opacity="0.8"/>
  <text x="100" y="105" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Product Data</text>
  <text x="100" y="120" font-family="Arial" font-size="10" text-anchor="middle" fill="white">(CSV)</text>
  
  <rect x="50" y="150" width="100" height="50" rx="5" ry="5" fill="#3498db" opacity="0.8"/>
  <text x="100" y="175" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Review Data</text>
  <text x="100" y="190" font-family="Arial" font-size="10" text-anchor="middle" fill="white">(JSON)</text>
  
  <!-- Data Loading -->
  <rect x="200" y="115" width="100" height="50" rx="5" ry="5" fill="#2c3e50" opacity="0.9"/>
  <text x="250" y="140" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Data Loading</text>
  <text x="250" y="155" font-family="Arial" font-size="10" text-anchor="middle" fill="white">(Read Files)</text>
  
  <!-- Data Cleaning -->
  <rect x="350" y="115" width="100" height="50" rx="5" ry="5" fill="#e74c3c" opacity="0.8"/>
  <text x="400" y="140" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Data Cleaning</text>
  <text x="400" y="155" font-family="Arial" font-size="10" text-anchor="middle" fill="white">(Fix & Format)</text>
  
  <!-- Data Transformation -->
  <rect x="500" y="115" width="100" height="50" rx="5" ry="5" fill="#f39c12" opacity="0.8"/>
  <text x="550" y="140" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Transformation</text>
  <text x="550" y="155" font-family="Arial" font-size="10" text-anchor="middle" fill="white">(Structure Data)</text>
  
  <!-- Data Cache -->
  <rect x="650" y="115" width="100" height="50" rx="5" ry="5" fill="#2ecc71" opacity="0.8"/>
  <text x="700" y="140" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Data Cache</text>
  <text x="700" y="155" font-family="Arial" font-size="10" text-anchor="middle" fill="white">(Fast Access)</text>
  
  <!-- Connector Lines -->
  <!-- Product Data to Loading -->
  <line x1="150" y1="105" x2="200" y2="125" stroke="#666" stroke-width="2"/>
  <polygon points="200,125 190,120 195,130" fill="#666"/>
  
  <!-- Review Data to Loading -->
  <line x1="150" y1="175" x2="200" y2="155" stroke="#666" stroke-width="2"/>
  <polygon points="200,155 190,160 195,150" fill="#666"/>
  
  <!-- Loading to Cleaning -->
  <line x1="300" y1="140" x2="350" y2="140" stroke="#666" stroke-width="2"/>
  <polygon points="350,140 340,135 340,145" fill="#666"/>
  
  <!-- Cleaning to Transformation -->
  <line x1="450" y1="140" x2="500" y2="140" stroke="#666" stroke-width="2"/>
  <polygon points="500,140 490,135 490,145" fill="#666"/>
  
  <!-- Transformation to Cache -->
  <line x1="600" y1="140" x2="650" y2="140" stroke="#666" stroke-width="2"/>
  <polygon points="650,140 640,135 640,145" fill="#666"/>
  
  <!-- Data Flow Labels -->
  <text x="175" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Raw Data</text>
  <text x="325" y="130" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Loaded Data</text>
  <text x="475" y="130" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Clean Data</text>
  <text x="625" y="130" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Structured Data</text>
  
  <!-- Access Arrow from Cache -->
  <path d="M 700,165 L 700,200 L 400,200" stroke="#666" stroke-width="2" fill="none"/>
  <polygon points="400,200 410,195 410,205" fill="#666"/>
  <text x="550" y="195" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Data Access for Analysis Agents</text>
</svg>
