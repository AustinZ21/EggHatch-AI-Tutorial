<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="250" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" text-anchor="middle" fill="#2c3e50">Agent State Workflow</text>
  
  <!-- Components -->
  <!-- User Query -->
  <rect x="50" y="80" width="120" height="60" rx="5" ry="5" fill="#3498db" opacity="0.8"/>
  <text x="110" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">User Query</text>
  
  <!-- Master Agent -->
  <rect x="220" y="80" width="120" height="60" rx="5" ry="5" fill="#2c3e50" opacity="0.9"/>
  <text x="280" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Master Agent</text>
  
  <!-- Agent State -->
  <rect x="390" y="80" width="120" height="60" rx="5" ry="5" fill="#e74c3c" opacity="0.8"/>
  <text x="450" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Agent State</text>
  
  <!-- Specialized Agents -->
  <rect x="220" y="180" width="120" height="60" rx="5" ry="5" fill="#9b59b6" opacity="0.8"/>
  <text x="280" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Specialized</text>
  <text x="280" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Agents</text>
  
  <!-- Response -->
  <rect x="560" y="80" width="120" height="60" rx="5" ry="5" fill="#2ecc71" opacity="0.8"/>
  <text x="620" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Response</text>
  
  <!-- Connector Lines -->
  <!-- User Query to Master Agent -->
  <line x1="170" y1="110" x2="220" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="220,110 210,105 210,115" fill="#666"/>
  
  <!-- Master Agent to Agent State -->
  <line x1="340" y1="110" x2="390" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="390,110 380,105 380,115" fill="#666"/>
  <text x="365" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Updates</text>
  
  <!-- Agent State to Response -->
  <line x1="510" y1="110" x2="560" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="560,110 550,105 550,115" fill="#666"/>
  <text x="535" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Informs</text>
  
  <!-- Master Agent to Specialized Agents -->
  <line x1="280" y1="140" x2="280" y2="180" stroke="#666" stroke-width="2"/>
  <polygon points="280,180 275,170 285,170" fill="#666"/>
  <text x="300" y="160" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Delegates</text>
  
  <!-- Specialized Agents to Agent State -->
  <path d="M 340,210 Q 390,210 450,140" stroke="#666" stroke-width="2" fill="none"/>
  <polygon points="450,140 445,150 440,145" fill="#666"/>
  <text x="400" y="190" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Updates</text>
  
  <!-- Agent State Components -->
  <rect x="390" y="150" width="120" height="90" rx="5" ry="5" fill="#ecf0f1" stroke="#2c3e50"/>
  <text x="450" y="165" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">• User Query</text>
  <text x="450" y="180" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">• Parameters</text>
  <text x="450" y="195" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">• Search Results</text>
  <text x="450" y="210" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">• Analysis Results</text>
  <text x="450" y="225" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">• Conversation Context</text>
</svg>
