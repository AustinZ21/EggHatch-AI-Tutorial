<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="300" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Workflow Steps -->
  <!-- User Query -->
  <rect x="50" y="120" width="120" height="60" rx="5" ry="5" fill="#4a6baf" opacity="0.8"/>
  <text x="110" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="white">User Query</text>
  
  <!-- Query Understanding -->
  <rect x="220" y="120" width="120" height="60" rx="5" ry="5" fill="#2c3e50" opacity="0.9"/>
  <text x="280" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Query Understanding</text>
  
  <!-- Task Planning -->
  <rect x="390" y="120" width="120" height="60" rx="5" ry="5" fill="#3498db" opacity="0.8"/>
  <text x="450" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Task Planning</text>
  
  <!-- Agent Delegation -->
  <rect x="560" y="120" width="120" height="60" rx="5" ry="5" fill="#e74c3c" opacity="0.8"/>
  <text x="620" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Agent Delegation</text>
  
  <!-- Specialized Agents (above and below) -->
  <rect x="560" y="30" width="120" height="40" rx="5" ry="5" fill="#2ecc71" opacity="0.8"/>
  <text x="620" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Sentiment Analysis</text>
  
  <rect x="560" y="230" width="120" height="40" rx="5" ry="5" fill="#f39c12" opacity="0.8"/>
  <text x="620" y="255" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Trend Analysis</text>
  
  <!-- Response Synthesis -->
  <rect x="390" y="230" width="120" height="60" rx="5" ry="5" fill="#9b59b6" opacity="0.8"/>
  <text x="450" y="265" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Response Synthesis</text>
  
  <!-- Final Response -->
  <rect x="220" y="230" width="120" height="60" rx="5" ry="5" fill="#1abc9c" opacity="0.8"/>
  <text x="280" y="265" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Final Response</text>
  
  <!-- Connector Lines -->
  <!-- User Query to Query Understanding -->
  <line x1="170" y1="150" x2="220" y2="150" stroke="#666" stroke-width="2"/>
  <polygon points="220,150 210,145 210,155" fill="#666"/>
  
  <!-- Query Understanding to Task Planning -->
  <line x1="340" y1="150" x2="390" y2="150" stroke="#666" stroke-width="2"/>
  <polygon points="390,150 380,145 380,155" fill="#666"/>
  
  <!-- Task Planning to Agent Delegation -->
  <line x1="510" y1="150" x2="560" y2="150" stroke="#666" stroke-width="2"/>
  <polygon points="560,150 550,145 550,155" fill="#666"/>
  
  <!-- Agent Delegation to Specialized Agents -->
  <line x1="620" y1="120" x2="620" y2="70" stroke="#666" stroke-width="2"/>
  <polygon points="620,70 615,80 625,80" fill="#666"/>
  
  <line x1="620" y1="180" x2="620" y2="230" stroke="#666" stroke-width="2"/>
  <polygon points="620,230 615,220 625,220" fill="#666"/>
  
  <!-- Specialized Agents to Response Synthesis -->
  <line x1="560" y1="50" x2="450" y2="230" stroke="#666" stroke-width="2"/>
  <polygon points="450,230 455,220 445,220" fill="#666"/>
  
  <line x1="560" y1="250" x2="510" y2="250" stroke="#666" stroke-width="2"/>
  <polygon points="510,250 520,245 520,255" fill="#666"/>
  
  <!-- Response Synthesis to Final Response -->
  <line x1="390" y1="260" x2="340" y2="260" stroke="#666" stroke-width="2"/>
  <polygon points="340,260 350,255 350,265" fill="#666"/>
  
  <!-- Final Response to User -->
  <line x1="220" y1="260" x2="110" y2="180" stroke="#666" stroke-width="2"/>
  <polygon points="110,180 115,190 120,185" fill="#666"/>
  
  <!-- Title -->
  <text x="400" y="20" font-family="Arial" font-size="18" text-anchor="middle" fill="#2c3e50">Master Agent Workflow</text>
</svg>
