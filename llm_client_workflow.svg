<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="250" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="18" text-anchor="middle" fill="#2c3e50">LLM Client Workflow</text>
  
  <!-- Components -->
  <!-- Master Agent -->
  <rect x="50" y="80" width="120" height="60" rx="5" ry="5" fill="#2c3e50" opacity="0.9"/>
  <text x="110" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Master Agent</text>
  
  <!-- LLM Client -->
  <rect x="250" y="80" width="120" height="60" rx="5" ry="5" fill="#3498db" opacity="0.8"/>
  <text x="310" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">LLM Client</text>
  
  <!-- Cache -->
  <rect x="250" y="180" width="120" height="40" rx="5" ry="5" fill="#9b59b6" opacity="0.7"/>
  <text x="310" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Cache</text>
  
  <!-- LLM API -->
  <rect x="450" y="80" width="120" height="60" rx="5" ry="5" fill="#e74c3c" opacity="0.8"/>
  <text x="510" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">LLM API</text>
  
  <!-- LLM Model -->
  <rect x="650" y="80" width="120" height="60" rx="5" ry="5" fill="#f39c12" opacity="0.8"/>
  <text x="710" y="115" font-family="Arial" font-size="14" text-anchor="middle" fill="white">LLM Model</text>
  
  <!-- Connector Lines -->
  <!-- Master Agent to LLM Client -->
  <line x1="170" y1="110" x2="250" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="250,110 240,105 240,115" fill="#666"/>
  <text x="210" y="100" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Prompt</text>
  
  <!-- LLM Client to Cache (Check) -->
  <line x1="310" y1="140" x2="310" y2="180" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="310,180 305,170 315,170" fill="#666"/>
  <text x="340" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Check Cache</text>
  
  <!-- LLM Client to LLM API -->
  <line x1="370" y1="110" x2="450" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="450,110 440,105 440,115" fill="#666"/>
  <text x="410" y="100" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">API Request</text>
  
  <!-- LLM API to LLM Model -->
  <line x1="570" y1="110" x2="650" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="650,110 640,105 640,115" fill="#666"/>
  
  <!-- LLM Model to LLM API -->
  <line x1="650" y1="130" x2="570" y2="130" stroke="#666" stroke-width="2"/>
  <polygon points="570,130 580,125 580,135" fill="#666"/>
  <text x="610" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Generated Text</text>
  
  <!-- LLM API to LLM Client -->
  <line x1="450" y1="130" x2="370" y2="130" stroke="#666" stroke-width="2"/>
  <polygon points="370,130 380,125 380,135" fill="#666"/>
  <text x="410" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">API Response</text>
  
  <!-- LLM Client to Cache (Update) -->
  <path d="M 280,140 Q 260,160 280,180" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <polygon points="280,180 275,170 285,175" fill="#666"/>
  <text x="240" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Update Cache</text>
  
  <!-- LLM Client to Master Agent -->
  <line x1="250" y1="130" x2="170" y2="130" stroke="#666" stroke-width="2"/>
  <polygon points="170,130 180,125 180,135" fill="#666"/>
  <text x="210" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Response</text>
</svg>
